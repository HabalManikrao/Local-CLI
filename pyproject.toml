[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-cle"
dynamic = ["version"]              # single-sourced from cle.__version__
description = "Local CLI Engineering (CLE) — offline-first, Ollama-powered local software engineering agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CLE" }]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]
# Note: FAISS (semantic), tree-sitter (parsing) and textual (TUI) are *potential*
# future accelerations. They are intentionally NOT declared as extras because
# nothing imports them yet — the pure-Python cosine index, the heuristic Java
# scanner and the Rich dashboard are the real implementations. Add an extra here
# only when code actually consumes the dependency.

[project.scripts]
cle = "cle.cli.main:app"

[tool.setuptools.dynamic]
version = { attr = "cle.__version__" }

[tool.setuptools.packages.find]
include = ["cle*"]

[tool.setuptools.package-data]
cle = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: integration tests (temp git repos, sqlite, ripgrep)",
    "e2e: end-to-end CLI subprocess tests",
]
filterwarnings = [
    # TestRunResult/TestFailure are domain classes, not test classes; pytest's
    # Test*-name heuristic misfires when a test module imports them.
    "ignore:cannot collect test class:pytest.PytestCollectionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "dist", "build", "local_cle.egg-info"]

[tool.ruff.lint]
# Pyflakes (F), pycodestyle (E/W), import-sort (I), bugbear (B), pyupgrade (UP),
# comprehensions (C4), simplify (SIM). A pragmatic, low-noise starting set.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",   # line length: mostly long string-literal schema examples; a
              # formatter's concern, not worth wrapping prose/JSON by hand.
    "UP042",  # `str, Enum` is intentional (3.11); StrEnum changes str()/format.
    "SIM112",  # "SystemRoot" is the canonical Windows env-var spelling.
]

[tool.mypy]
python_version = "3.11"
files = ["cle"]
# Third-party libs without type stubs (typer/rich internals, etc.).
ignore_missing_imports = true
# Catch real bugs (e.g. str - int) even in not-fully-annotated functions,
# without demanding complete annotations across the codebase yet.
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
warn_unused_ignores = true
