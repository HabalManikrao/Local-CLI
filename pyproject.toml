[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-cle"
version = "0.1.0"
description = "Local CLI Engineering (CLE) — offline-first, Ollama-powered local software engineering agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CLE" }]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Semantic search / precise structural parsing — light up when installed.
semantic = ["faiss-cpu>=1.8"]
parsing = ["tree-sitter>=0.21", "tree-sitter-java>=0.21"]
tui = ["textual>=0.60"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
cle = "cle.cli.main:app"

[tool.setuptools.packages.find]
include = ["cle*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: integration tests (temp git repos, sqlite, ripgrep)",
    "e2e: end-to-end CLI subprocess tests",
]
